name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      # the shipped core is built against patched xray-core, so that is what gets tested.
      # `-modfile go.patched.mod`, not `=`: pwsh, the windows shell, splits -modfile=go.patched.mod
      # at the dot and go gets -modfile=go
      - run: go run ./tools/patchxray
      - run: go vet -modfile go.patched.mod ./...
      - run: go build -modfile go.patched.mod ./...
      - run: go test -modfile go.patched.mod ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/patchxray
      - name: build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -modfile go.patched.mod ./...
